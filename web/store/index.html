<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owl Park — Tickets</title>
<link rel="stylesheet" href="/store/store.css">
</head>
<body>
<main class="st-main">
  <section class="st-hero">
    <h1 id="venue-name">Owl Park</h1>
    <p>Hands-on science, a 40-seat planetarium dome, and star-lab workshops.
       Buy day tickets, timed planetarium entry, and annual memberships online —
       print your tickets at home and walk straight to the gate.</p>
  </section>

  <div id="error"></div>

  <h2 class="st-section">Day tickets &amp; add-ons</h2>
  <div class="st-grid" id="tickets"></div>

  <h2 class="st-section">Timed-entry experiences</h2>
  <div class="st-grid" id="events"></div>

  <h2 class="st-section">Memberships</h2>
  <div class="st-grid" id="memberships"></div>
</main>

<script src="/store/store.js"></script>
<script>
'use strict';
gs.init('home');

(async () => {
  let cat;
  try {
    cat = await gs.api('/api/store/catalog');
  } catch (err) {
    document.getElementById('error').innerHTML =
      `<div class="st-error">Could not load the store: ${gs.esc(err.message)}</div>`;
    return;
  }
  document.getElementById('venue-name').textContent = cat.venue;
  document.title = cat.venue + ' — Tickets';

  const plain = cat.products.filter((p) => p.kind !== 'membership' && p.event_id == null);
  const memberships = cat.products.filter((p) => p.kind === 'membership');

  const card = (p, extra) => `
    <div class="st-card">
      <h3>${gs.esc(p.name)}</h3>
      <div class="price">${gs.money(p.price_cents)}</div>
      <div class="desc">${extra || ''}</div>
      <button class="st-btn" data-add="${p.id}">Add to cart</button>
    </div>`;

  document.getElementById('tickets').innerHTML = plain
    .map((p) => card(p, p.kind === 'addon' ? 'Add-on' : `Valid ${p.validity_days} days from purchase`))
    .join('') || '<p class="st-muted">Nothing on sale right now.</p>';

  document.getElementById('memberships').innerHTML = memberships
    .map((p) => card(p, 'Annual pass — issued instantly with your order'))
    .join('') || '<p class="st-muted">No membership programs on sale.</p>';

  // Timed-entry: one card per active event, linking to its session picker.
  document.getElementById('events').innerHTML = cat.events
    .map((ev) => {
      const prods = cat.products.filter((p) => p.event_id === ev.id);
      const from = prods.length ? Math.min(...prods.map((p) => p.price_cents)) : null;
      return `
        <div class="st-card">
          <h3>${gs.esc(ev.name)}</h3>
          ${from != null ? `<div class="price">from ${gs.money(from)}</div>` : ''}
          <div class="desc">${gs.esc(ev.description || 'Timed entry — pick a date and showtime.')}</div>
          <a class="st-btn" href="/store/event.html?id=${ev.id}">Pick a showtime</a>
        </div>`;
    })
    .join('') || '<p class="st-muted">No timed-entry events scheduled.</p>';

  const byId = new Map(cat.products.map((p) => [p.id, p]));
  document.body.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-add]');
    if (!btn) return;
    const p = byId.get(Number(btn.dataset.add));
    if (!p) return;
    gs.cartAdd({ product_id: p.id, name: p.name, price_cents: p.price_cents, qty: 1 });
    btn.textContent = 'Added ✓';
    setTimeout(() => { btn.textContent = 'Add to cart'; }, 1200);
  });
})();
</script>
</body>
</html>
