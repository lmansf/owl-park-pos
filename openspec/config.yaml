schema: spec-driven

context: |
  Owl Park Point of Sale: self-contained attractions ticketing suite (POS, gate
  admissions, memberships, timed events, guest web store, reporting) for the
  fictional Owl Park. Demo-grade auth and simulated payments.
  Hard constraints:
  - Zero npm dependencies and zero network at runtime. Node 22 built-ins only
    (node:http, node:sqlite, node:crypto). Vanilla-JS frontend, no build step,
    no CDN/fonts/assets.
  - All DDL lives in server/migrations/ (core-owned); modules write no DDL.
  - Money is integer cents; timestamps ISO-8601 UTC; day boundaries ("today",
    report bucketing) are server-local time throughout.
  Invariant chokepoints (frozen contracts):
  - pos.finalizeOrder is the only path that marks orders paid, issues tickets,
    and moves session capacity — POS and web store both use it.
  - admissions.checkCode is the only admit/deny path; always writes an admits row.
  Modules degrade gracefully when siblings are absent (ctx.modules.X presence
  checks, POS auto-grid fallback, static store fallback).

rules:
  proposal:
    - Always include a Non-goals section
  design:
    - Frozen cross-team contracts get their own section, explicitly marked frozen
  tasks:
    - Group tasks into serial core phases and parallel team phases
